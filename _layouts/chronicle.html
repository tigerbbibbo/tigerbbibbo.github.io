<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1913">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/chronicle/style.css' | relative_url }}">
</head>
<body id="top">
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="masthead">
    <a class="brand" href="{{ '/' | relative_url }}"><span aria-hidden="true">✦</span> {{ site.title | escape }}</a>
    <nav aria-label="주 메뉴">
      {% for chapter in page.chapters %}
      <a href="#{{ chapter.id | escape }}">{{ chapter.title | escape }}</a>
      {% endfor %}
      <a href="{{ '/games/' | relative_url }}"{% if page.url == '/games/' %} aria-current="page"{% endif %}>게임</a>
    </nav>
  </header>
  <main class="journal" id="main">
    <div class="paper" aria-hidden="true"></div>
    <div class="folio">
      {{ content }}
    </div>
  </main>
  <footer class="colophon">
    <span>지도 자료 · Wikimedia Commons</span>
    <div>
      <a href="https://commons.wikimedia.org/wiki/File:Cantino_planisphere_(1502).jpg">칸티노 세계지도</a>
      <a href="https://commons.wikimedia.org/wiki/File:West_Africa_Catalan_Atlas.jpg">카탈루냐 지도</a>
    </div>
  </footer>
</body>
</html>
