<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 동네 타이쿤</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div><span class="eyebrow">작은 가게에서 시작하는 경제 게임</span><h1>🏪 우리 동네 타이쿤</h1><p>물건을 사고, 가격을 정하고, 가게를 키워 보세요.</p></div>
      <button id="reset" class="ghost">새 게임</button>
    </header>
    <section class="stats" aria-label="가게 현황">
      <div class="card"><span>📅 날짜</span><strong id="day"></strong></div>
      <div class="card"><span>💰 보유 현금</span><strong id="cash"></strong></div>
      <div class="card"><span>⭐ 가게 평판</span><strong id="reputation"></strong></div>
      <div class="card"><span>🏬 가게 등급</span><strong id="level"></strong></div>
    </section>
    <div class="layout">
      <section class="panel"><div class="panel-title"><h2>상품 관리</h2><span>매입 후 판매 가격을 조절하세요</span></div><div id="products" class="products"></div></section>
      <aside class="sidebar">
        <section class="panel"><h2>가게 성장</h2><p class="hint">업그레이드하면 더 많은 손님이 찾아옵니다.</p><button id="upgrade" class="upgrade"></button></section>
        <section class="panel action"><h2>영업 시작</h2><p>준비가 끝났다면 하루를 진행하세요.</p><button id="next-day" class="primary">하루 영업하기 →</button></section>
        <section class="panel"><h2>오늘의 소식</h2><div id="news" class="news" aria-live="polite"></div></section>
      </aside>
    </div>
    <footer>진행 상황은 이 브라우저에 자동 저장됩니다.</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
